<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-indicator margins;
         everything that needs to stay clear of them uses env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Tints the iOS standalone status bar and the Android address bar. Matches
         --color-bg: a dark strip above a white app reads as a web page, not an app. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Installed-app hints. `apple-mobile-web-app-capable` is the legacy spelling of
         the manifest's display:standalone and is still what older iOS reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The home screen label; without it iOS uses <title>, which is longer. -->
    <meta name="apple-mobile-web-app-title" content="Album" />

    <title>Open Album</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS never rasterises an SVG for the home screen — with only the manifest's SVG
         it falls back to a screenshot of the page. Rendered by scripts/render-icons.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
